<header
    id="enterprise-header"
    class="enterprise-header"
>

    <!-- LEFT -->

    <div class="header-left">

    <button
        id="btn-collapse"
        class="header-collapse-btn"
        type="button"
        aria-label="Buka atau tutup sidebar"
        aria-controls="enterprise-sidebar"
        aria-expanded="true"
    >
        <!-- Menggunakan SVG Ikon Hamburger Modern -->
        <svg 
            class="icon-collapse" 
            xmlns="http://w3.org" 
            fill="none" 
            viewBox="0 0 24 24" 
            stroke-width="2" 
            stroke="currentColor"
        >
            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>
    </button>

</div>
