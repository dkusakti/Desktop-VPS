<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- LAPIS 4 & 19: Content Security Policy (CSP) Ketat untuk Blokir Eksekusi Skrip Luar & Eval -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:;">
    
    <title>Login Ultra Fidelity Perfect</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- ULTRAGLOW DYNAMIC NEBULA CANVAS (SISTEM DEKORASI LIGHT LEAKS) -->
    <div class="mesh-container">
        <div class="fluid-orb orb-primary"></div>
        <div class="fluid-orb orb-secondary"></div>
        <div class="fluid-orb orb-accent"></div>
    </div>

    <div class="viewport-canvas">
        <div class="login-card-master">
            
            <!-- LINGKARAN 1: Blob Utama (Matte Obsidian Black) -->
            <div class="asymmetric-blob-base">
                <div class="inner-shadow-overlay"></div>
            </div>

            <!-- LINGKARAN 2: Blob Sekunder -->
            <div class="asymmetric-blob-secondary">
                <div class="inner-shadow-overlay"></div>
            </div>

            <!-- LAPISAN KONTEN: Seluruh Elemen Interaktif -->
            <div class="interactive-foreground">
                
                <div class="avatar-boundary">
                    <div class="avatar-gradient-core">
                        <svg viewBox="0 0 100 100" class="user-vector-shape">
                            <circle cx="50" cy="35" r="16.5" fill="#ffffff"/>
                            <path d="M50,57.5 C31.5,57.5 20.5,70.5 20.5,84.5 L79.5,84.5 C79.5,70.5 68.5,57.5 50,57.5 Z" fill="#ffffff"/>
                        </svg>
                    </div>
                </div>

                <h1 class="heading-signin">Sign In</h1>

                <form id="loginForm">
                    
                    <div class="input-container-row">
                        <div class="gradient-icon-square">
                            <svg viewBox="0 0 24 24"><path fill="#ffffff" d="M12,12c2.21,0,4-1.79,4-4s-1.79-4-4-4s-4,1.79-4,4S9.79,12,12,12z M12,14c-2.67,0-8,1.34-8,4v2h16v-2C20,15.34,14.67,14,12,14z"/></svg>
                        </div>
                        <div class="capsule-field-wrapper">
                            <!-- PROTEKSI: autocomplete dimatikan total untuk mencegah pencurian token form data -->
                            <input type="text" id="usernameInput" placeholder="Username" required autocomplete="off" spellcheck="false">
                        </div>
                    </div>

                    <div class="input-container-row">
                        <div class="gradient-icon-square">
                            <svg viewBox="0 0 24 24"><path fill="#ffffff" d="M18,8h-1V6c0-2.76-2.24-5-5-5S7,3.24,7,6v2H6c-1.1,0-2,0.9-2,2v10c0,1.1,0.9,2,2,2h12c1.1,0,2-0.9,2-2V10C20,8.9,19.1,8,18,8z M9,6c0-1.66,1.34-3,3-3s3,1.34,3,3v2H9V6z"/></svg>
                        </div>
                        <div class="capsule-field-wrapper">
                            <!-- PROTEKSI: Menggunakan new-password agar Chromium tidak menyimpannya dalam memori tidak aman -->
                            <input type="password" id="passwordInput" placeholder="Password" required autocomplete="new-password" spellcheck="false">
                            <div class="eye-toggle-trigger" id="eyeToggleBtn">
                                <svg id="eyeIcon" viewBox="0 0 24 24">
                                    <path fill="#64748b" d="M12,7c2.76,0,5,2.24,5,5c0,1.11-0.36,2.13-0.97,2.97l2.38,2.38C20.35,15.93,21.75,13.9,22.42,11.5C20.72,7.23,16.71,4.2,12,4.2c-1.26,0-2.47,0.24-3.58,0.68l1.71,1.71C10.73,6.34,11.35,6.2,12,7z M2,4.27l2.28,2.28C2.43,8.02,1.09,10.05,0.42,12.5c1.72,4.27,5.73,7.3,10.58,7.3c1.42,0,2.78-0.27,4.03-0.75l3.7,3.7l1.27-1.27L3.27,3L2,4.27z M7.41,9.68l2.23,2.23C9.57,12.1,9.5,12.29,9.5,12.5c0,1.38,1.12,2.5,2.5,2.5c0.21,0,0.4-0.07,0.59-0.14l2.33,2.33c-0.7,0.52-1.54,0.84-2.45,0.84c-2.76,0-5-2.24-5-5C7.41,11.52,7.73,10.68,7.41,9.68z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="meta-options-line">
                        <label class="remember-me-label">
                            <input type="checkbox" id="rememberMeCheck" autocomplete="off">
                            <span class="square-indicator-box"></span>
                            <span class="label-text-string">Remember me</span>
                        </label>
                        <a href="#" class="forgot-password-anchor" id="forgotPasswordLink">Forgot password?</a>
                    </div>

                    <div class="execution-footer-line">
                        <button type="submit" id="submitBtn" class="primary-login-btn">LOGIN</button>
                    </div>

                    <!-- Tempat notifikasi status login terisolasi -->
                    <!-- FIX SINKRONISASI DOM: Pangkas tag <p> buntu agar id="authStatusMessage" menjadi single text node kaku yang seragam -->
                    <div id="authStatusMessage" class="" style="margin-top: 15px; min-height: 40px; display: flex; align-items: center; justify-content: center; width: 100%; font-family: sans-serif; font-size: 13px; text-align: center; line-height: 1.5; font-weight: bold; transition: all 0.3s ease-in-out;"></div>

                </form>
            </div>
        </div>
    </div>

    <!-- Sinkronisasi Nama File JS Page Sesuai Tree Direktori Lokal Anda -->
    <script src="login.js"></script>
</body>
</html>
