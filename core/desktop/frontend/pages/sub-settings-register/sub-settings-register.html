<section class="settings-page">
  <div class="settings-page-header">
    <h2>Registrasi Akun Karyawan Baru</h2>
    <p>
      Buat akun baru dengan role yang sesuai kewenangan sistem.
    </p>
  </div>

  <div class="settings-card" class="register-card">
    <div class="settings-card-title">Data Akun Baru</div>

    <div class="register-field">
      <label
        for="select-register-role"
        class="register-label"
      >
        ROLE AKUN
      </label>

      <select
        id="select-register-role"
        class="register-control"
      >
        <option value="user">USER (Karyawan Standar)</option>
        <option value="adminmaster">ADMIN MASTER (Pengatur Sistem)</option>
      <option value="owner">OWNER (Pemilik Sistem)</option>
      </select>
    </div>

    <div class="register-password-field">
      <label
        for="input-register-pass"
        class="register-label"
      >
        PASSWORD SEMENTARA
      </label>

      <input
        type="password"
        id="input-register-pass"
        autocomplete="new-password"
        minlength="6"
        maxlength="88"
        placeholder="Minimal 6 karakter..."
        class="register-control"
      >
    </div>

    <button
      id="btn-submit-register"
      type="button"
      class="register-submit"
    >
      GENERASI AKUN BARU
    </button>

    <div
      id="register-status"
      class="settings-status"
      aria-live="polite"
      class="register-status-spacing"
    ></div>

    <div
      id="box-hasil-cetak"
      class="register-result-hidden"
    >
      <div class="settings-card-title">Hasil Registrasi</div>

      <div class="settings-role-list">
        <div class="settings-role-item">
          <strong>Username</strong>
          <span id="res-username">-</span>
        </div>

        <div class="settings-role-item">
          <strong>Role</strong>
          <span id="res-role">-</span>
        </div>

        <div class="settings-role-item">
          <strong>Password Sementara</strong>
          <span id="res-password">-</span>
        </div>
      </div>
    </div>
  </div>
</section>
