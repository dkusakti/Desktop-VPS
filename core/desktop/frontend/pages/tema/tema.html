<div class="settings-page">
  <div class="settings-page-header">
    <h2>Tema</h2>
    <p>Atur tampilan workspace Enterprise.</p>
  </div>

  <div class="settings-card">
    <div class="settings-card-title">Tema Workspace</div>

    <label class="settings-option">
      <input type="radio" name="workspace-theme" value="dark">
      <span>
        <strong>Dark</strong>
        <small>Tema utama workspace dengan latar gelap.</small>
      </span>
    </label>

    <label class="settings-option">
      <input type="radio" name="workspace-theme" value="light">
      <span>
        <strong>Light</strong>
        <small>Tema terang untuk workspace.</small>
      </span>
    </label>
  </div>
</div>
