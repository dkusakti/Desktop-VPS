<section class="settings-page">
  <div class="settings-page-header">
    <h2>🔑 Pembaruan Kata Sandi Mandiri</h2>
    <p>
      Perbarui kata sandi akun untuk menjaga keamanan akses ke workspace.
    </p>
  </div>

  <div class="settings-card" style="max-width: 520px;">
    <div class="settings-card-title">Kredensial Akun</div>

    <div style="margin-bottom: 16px;">
      <label
        for="pass-lama"
        style="display:block; margin-bottom:8px; font-weight:600;"
      >
        KATA SANDI LAMA
      </label>

      <input
        type="password"
        id="pass-lama"
        autocomplete="current-password"
        placeholder="Masukkan kata sandi lama..."
        style="width:100%; box-sizing:border-box;"
      >
    </div>

    <div style="margin-bottom: 20px;">
      <label
        for="pass-baru"
        style="display:block; margin-bottom:8px; font-weight:600;"
      >
        KATA SANDI BARU
      </label>

      <input
        type="password"
        id="pass-baru"
        autocomplete="new-password"
        minlength="6"
        maxlength="128"
        placeholder="Minimal 6 karakter..."
        style="width:100%; box-sizing:border-box;"
      >
    </div>

    <button
      id="btn-submit-password"
      type="button"
      style="width:100%;"
    >
      PERBARUI KATA SANDI
    </button>

    <div
      id="password-status"
      class="settings-status"
      aria-live="polite"
      style="margin-top:16px;"
    ></div>
  </div>
</section>
